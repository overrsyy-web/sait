{% extends "base.html" %}
{% block title %}Админка — Nexus Mods{% endblock %}
{% block content %}
<div class="container" style="margin-top: 40px;">
    <h1>Управление модами</h1>
    <table class="table" style="margin-top: 20px;">
        <thead>
            <tr><th>ID</th><th>Название</th><th>Статус</th><th>Действие</th></tr>
        </thead>
        <tbody>
            {% for m in mods %}
                <tr>
                    <td>{{ m.id_mod }}</td>
                    <td>{{ m.Название }}</td>
                    <td>{% if m.Активен == -1 %}✅ Да{% else %}❌ Нет{% endif %}</td>
                    <td><a href="{{ url_for('mod_page', mod_id=m.id_mod) }}" class="btn btn--ghost">Открыть</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
