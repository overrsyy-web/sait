{% extends "base.html" %}
{% block title %}Вход — Nexus Mods{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Вход в аккаунт</h2>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Логин<input type="text" name="login" value="{{ login }}" required></label>
            <label>Пароль<input type="password" name="password" required></label>
            <button type="submit" class="btn btn--accent btn--block">Войти</button>
        </form>
        <p class="muted text-center" style="margin-top: 20px;">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
