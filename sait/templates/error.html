{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="container text-center" style="padding: 100px 0;">
    <h1 style="font-size: 80px; color: var(--accent);">{{ code }}</h1>
    <p style="font-size: 20px; color: var(--muted); margin-bottom: 30px;">{{ message }}</p>
    <a href="{{ url_for('catalog') }}" class="btn btn--accent">На главную</a>
</div>
{% endblock %}
