{% extends "base.html" %}
{% block title %}Регистрация — Nexus Mods{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Регистрация</h2>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Никнейм<input type="text" name="login" value="{{ login }}" required></label>
            <label>Email<input type="email" name="email" value="{{ email }}" required></label>
            <label>Пароль<input type="password" name="password" required></label>
            <button type="submit" class="btn btn--accent btn--block">Создать аккаунт</button>
        </form>
        <p class="muted text-center" style="margin-top: 20px;">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </div>
</div>
{% endblock %}
